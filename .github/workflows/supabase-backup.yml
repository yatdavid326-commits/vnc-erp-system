name: Supabase encrypted backup

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      verify_original:
        description: Verify the original backup artifacts
        type: boolean
        default: false
      compare_password:
        description: Verify the saved re-encryption password
        type: boolean
        default: false
      reencrypt_original:
        description: Re-encrypt the original operations backup
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  backup:
    if: ${{ inputs.verify_original != true && inputs.compare_password != true && inputs.reencrypt_original != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, operations]
    environment: ${{ matrix.environment }}

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17

      - name: Create database backup
        env:
          SUPABASE_DB_CONNECTION_STRING: ${{ secrets.SUPABASE_DB_CONNECTION_STRING }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          BACKUP_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_CONNECTION_STRING"
          test -n "$BACKUP_ENCRYPTION_PASSWORD"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="vnc-erp-${BACKUP_ENVIRONMENT}-${stamp}.dump"
          trap 'rm -f -- "$backup"' EXIT
          echo "BACKUP_NAME=${backup}.enc" >> "$GITHUB_ENV"
          pg_dump --format=custom --no-owner --no-acl --file="$backup" "$SUPABASE_DB_CONNECTION_STRING"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$backup" \
            -out "${backup}.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSWORD
          sha256sum "${backup}.enc" > "${backup}.enc.sha256"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: |
            *.dump.enc
            *.dump.enc.sha256
          if-no-files-found: error
          retention-days: 30

  verify-original:
    if: ${{ inputs.verify_original == true && inputs.compare_password != true && inputs.reencrypt_original != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: operations
            artifact: vnc-erp-operations-20261126T032441Z.dump.enc
          - environment: staging
            artifact: vnc-erp-staging-20261126T032452Z.dump.enc
    environment: ${{ matrix.environment }}
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
      - name: Download original encrypted backup
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: 45748702952
          github-token: ${{ github.token }}
          path: backup
      - name: Verify decryption and archive catalog
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          BACKUP_NAME: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_ENCRYPTION_PASSWORD"
          cd backup
          sha256sum --check "${BACKUP_NAME}.sha256"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$BACKUP_NAME" -pass env:BACKUP_ENCRYPTION_PASSWORD \
            | pg_restore --list > /dev/null
          echo "Decryption and catalog inspection succeeded."

  compare-password:
    if: ${{ inputs.compare_password == true && inputs.verify_original != true && inputs.reencrypt_original != true }}
    runs-on: ubuntu-latest
    environment: operations
    steps:
      - name: Compare saved backup password
        env:
          ORIGINAL: ${{ secrets.BACKUP_CONFIRMATION_PASSWORD }}
          CANDIDATE: ${{ secrets.BACKUP_SAVED_KEY_CHECK }}
        run: |
          set -eu
          test -n "$ORIGINAL"
          test -n "$CANDIDATE"
          if [ "$ORIGINAL" = "$CANDIDATE" ]; then
            echo "Saved password matches."
          else
            echo "Saved password does not match."
            exit 1
          fi

  reencrypt-original:
    if: ${{ inputs.reencrypt_original == true && inputs.verify_original != true && inputs.compare_password != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: operations
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
      - name: Download original encrypted backup
        uses: actions/download-artifact@v4
        with:
          name: vnc-erp-operations-20261126T032441Z.dump.enc
          run-id: 45748702952
          github-token: ${{ github.token }}
          path: backup
      - name: Re-encrypt and verify archive
        env:
          OLD_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          NEW_PASSWORD: ${{ secrets.BACKUP_CONFIRMATION_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OLD_PASSWORD"
          test -n "$NEW_PASSWORD"
          if [ "$OLD_PASSWORD" = "$NEW_PASSWORD" ]; then
            echo "The new password must differ from the original."
            exit 1
          fi
          cd backup
          original='vnc-erp-operations-20261126T032441Z.dump.enc'
          sha256sum --check "${original}.sha256"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$original" -pass env:OLD_PASSWORD \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -out operations-reencrypted.dump.enc -pass env:NEW_PASSWORD
          openssl enc -d -aes-256-cbc -pbkdf2 -in operations-reencrypted.dump.enc -pass env:NEW_PASSWORD \
            | pg_restore --list > /dev/null
          sha256sum operations-reencrypted.dump.enc > operations-reencrypted.dump.enc.sha256
      - name: Upload re-encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: vnc-erp-operations-reencrypted-original
          path: |
            backup/operations-reencrypted.dump.enc
            backup/operations-reencrypted.dump.enc.sha256
          if-no-files-found: error
          retention-days: 30
